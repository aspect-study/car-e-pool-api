services:

  # ── MySQL ─────────────────────────────────────────────────────────────────
  mysql_db:
    image: mysql:8.0
    container_name: car-e-pool-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE:      ${DB_NAME}
      MYSQL_USER:          ${DB_USERNAME}
      MYSQL_PASSWORD:      ${DB_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - carpool-mysql-data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+08:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u${DB_USERNAME}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Carpool API ───────────────────────────────────────────────────────────
  carpool-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: car-e-pool-api
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Aligned with application-prod.properties variable names
      DB_URL:              jdbc:mysql://mysql_db:3306/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila
      DB_USERNAME:         ${DB_USERNAME}
      DB_PASSWORD:         ${DB_PASSWORD}
      JWT_SECRET:          ${JWT_SECRET}
      JWT_EXPIRATION_MS:   86400000
      TELEGRAM_BOT_TOKEN:  ${TELEGRAM_BOT_TOKEN}
    depends_on:
      mysql_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  carpool-mysql-data:
    driver: local