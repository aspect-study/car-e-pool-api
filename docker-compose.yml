services:

  # ── MySQL ─────────────────────────────────────────────────────────────────
  mysql_db:
    image: mysql:8.0
    container_name: car-e-pool-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    #Left port is Windows, Right is Docker.
    ports:
      - "3308:3306"
    volumes:
      - carpool-mysql-data:/var/lib/mysql
    # Tune MySQL for development — relax durability for speed
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+08:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ucarpool", "-pcarpool"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Carpool API ───────────────────────────────────────────────────────────
  carpool-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carpool-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: dev-secret-replace-in-production-must-be-256bits-minimum
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # Override datasource URL to use Docker service name instead of localhost
      SPRING_DATASOURCE_URL: "jdbc:mysql://$${DB_HOST:localhost}:$${DB_PORT:3306}/$${DB_NAME:carpool}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila"

    depends_on:
      mysql_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  carpool-mysql-data:
    driver: local
