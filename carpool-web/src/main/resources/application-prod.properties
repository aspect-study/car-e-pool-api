# ============================================================
# Production Configuration
# All values must be supplied via environment variables
# Never hardcode credentials in this file
# ============================================================

# ── Database ─────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Tighter pool for production
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=20000

# ── JPA ──────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ── JWT ───────────────────────────────────────────────────────────────────────
carpool.jwt.secret=${JWT_SECRET}
carpool.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── Telegram ─────────────────────────────────────────────────────────────────
carpool.telegram.bot-token=${TELEGRAM_BOT_TOKEN}
carpool.telegram.bot-username=${TELEGRAM_BOT_USERNAME:CarEPoolPHBot}
carpool.telegram.auth-max-age-seconds=86400

# ── Rate Limiting ─────────────────────────────────────────────────────────────
carpool.rate-limit.capacity=100
carpool.rate-limit.refill-tokens=100
carpool.rate-limit.refill-seconds=60

# ── Bot Rate Limiting ─────────────────────────────────────────────────────────
carpool.bot.rate-limit.capacity=30
carpool.bot.rate-limit.refill-tokens=30
carpool.bot.rate-limit.refill-seconds=60
carpool.bot.rate-limit.warn-interval-seconds=10

# ── Community ─────────────────────────────────────────────────────────────────
carpool.community.name=${COMMUNITY_NAME:Car-e-Pool PH}

# ── Logging — minimal in production ──────────────────────────────────────────
logging.level.com.carpool=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ── Actuator — restrict exposure in production ────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ── Swagger UI (disabled in production) ──────────────────────────────────────
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true