# ============================================================
# Production Configuration
# All values must be supplied via environment variables
# Never hardcode credentials in this file
# ============================================================
spring.application.name=carpool-api

# ── Database ─────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Tighter pool for production
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA ──────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── Flyway ───────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# ── Async (for notification events) ─────────────────────────────────────────
# Spring's @Async also uses virtual threads when spring.threads.virtual is enabled.
# No separate thread pool config needed — virtual threads handle it.
spring.threads.virtual.enabled=true

# ── Cache (Caffeine) ─────────────────────────────────────────────────────────
spring.cache.type=caffeine
# hubs: long TTL (rarely changes), users: shorter TTL
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=60m
# Per-cache overrides are configured in CacheConfig.java

# ── JWT ───────────────────────────────────────────────────────────────────────
carpool.jwt.secret=${JWT_SECRET}
carpool.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── Telegram ─────────────────────────────────────────────────────────────────
carpool.telegram.bot-token=${TELEGRAM_BOT_TOKEN}
carpool.telegram.bot-username=${TELEGRAM_BOT_USERNAME:CarEPoolPHBot}
carpool.telegram.auth-max-age-seconds=86400
carpool.telegram.group-chat-id=${TELEGRAM_GROUP_CHAT_ID}
carpool.telegram.group-home-to-work-topic-id=${TELEGRAM_GROUP_HOME_TO_WORK_TOPIC_ID}
carpool.telegram.group-work-to-home-topic-id=${TELEGRAM_GROUP_WORK_TO_HOME_TOPIC_ID}

# ── Rate Limiting ─────────────────────────────────────────────────────────────
carpool.rate-limit.capacity=100
carpool.rate-limit.refill-tokens=100
carpool.rate-limit.refill-seconds=60

# ── Bot Rate Limiting ─────────────────────────────────────────────────────────
carpool.bot.rate-limit.capacity=30
carpool.bot.rate-limit.refill-tokens=30
carpool.bot.rate-limit.refill-seconds=60
carpool.bot.rate-limit.warn-interval-seconds=10

# ── Community ─────────────────────────────────────────────────────────────────
carpool.community.name=${COMMUNITY_NAME:Car-e-Pool PH}
carpool.community.corridor=South MM to BGC/Makati

# ── Logging — minimal in production ──────────────────────────────────────────
logging.level.com.carpool=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ── Actuator — restrict exposure in production ────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ── Jackson ──────────────────────────────────────────────────────────────────
spring.jackson.time-zone=Asia/Manila
spring.jackson.default-property-inclusion=non_null

# ── Swagger UI (disabled in production) ──────────────────────────────────────
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ── Bot Admin ──────────────────────────────────────
carpool.admin.telegram-ids=208038458