# ============================================================
# Carpool API - Application Configuration
# ============================================================

spring.application.name=carpool-api
server.port=8080

# ── Database ─────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/carpool_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila
spring.datasource.username=${DB_USERNAME:carpool}
spring.datasource.password=${DB_PASSWORD:carpool}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool tuning for 5k users (HikariCP defaults are fine, but explicit is better)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── Flyway ───────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# ── Virtual Threads (Java 21 + Spring Boot 3.2+) ─────────────────────────────
# Enables virtual threads for all request handling — replaces platform thread pool
spring.threads.virtual.enabled=true

# ── Async (for notification events) ─────────────────────────────────────────
# Spring's @Async also uses virtual threads when the above is enabled.
# No separate thread pool config needed — virtual threads handle it.

# ── Cache (Caffeine) ─────────────────────────────────────────────────────────
spring.cache.type=caffeine
# hubs: long TTL (rarely changes), users: shorter TTL
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=60m
# Per-cache overrides are configured in CacheConfig.java

# ── JWT ───────────────────────────────────────────────────────────────────────
# Override via environment variable in production — never hardcode in prod
carpool.jwt.secret=${JWT_SECRET:change-this-secret-in-production-must-be-at-least-256-bits}
carpool.jwt.expiration-ms=86400000

# ── Telegram ─────────────────────────────────────────────────────────────────
carpool.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
# Auth data from Telegram Login Widget expires after this many seconds
carpool.telegram.auth-max-age-seconds=86400

# ── Rate Limiting (Bucket4j) ─────────────────────────────────────────────────
# Applied per IP via RateLimitFilter — configurable per endpoint in filter config
carpool.rate-limit.capacity=60
carpool.rate-limit.refill-tokens=60
carpool.rate-limit.refill-seconds=60

# ── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=Carpool API
info.app.version=1.0.0

# ── Jackson ──────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Manila
spring.jackson.default-property-inclusion=non_null

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.carpool=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.flywaydb=INFO
