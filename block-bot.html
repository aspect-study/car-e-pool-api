<html lang="en">
<meta charset="utf-8">
<title>Block Bot</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F2FF; --surface:#FFFFFF; --surface2:#EFE9FF;
  --ink:#241C3D; --ink-soft:#5B5478;
  --accent:#7C3AED; --accent-ink:#FFFFFF;
  --gold:#FFC93C; --coral:#FF6B6B;
  --good:#22A560; --bad:#E0483E;
  --border:#E1D8FA;
  --shadow: 0 8px 24px rgba(124,58,237,0.14);
  --radius:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161022; --surface:#211934; --surface2:#2A2044;
    --ink:#F2EEFF; --ink-soft:#B8AEDD;
    --accent:#9D6BFF; --accent-ink:#161022;
    --gold:#FFD666; --coral:#FF8A80;
    --good:#3FCB86; --bad:#FF6B60;
    --border:#382A57;
    --shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
}
:root[data-theme="dark"]{
  --bg:#161022; --surface:#211934; --surface2:#2A2044;
  --ink:#F2EEFF; --ink-soft:#B8AEDD;
  --accent:#9D6BFF; --accent-ink:#161022;
  --gold:#FFD666; --coral:#FF8A80;
  --good:#3FCB86; --bad:#FF6B60;
  --border:#382A57;
  --shadow: 0 8px 24px rgba(0,0,0,0.4);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Mulish',system-ui,sans-serif;
  min-height:100vh;
}
h1,h2,h3,.display{font-family:'Lilita One',cursive; font-weight:400; letter-spacing:0.02em;}
.app{max-width:720px; margin:0 auto; padding:20px 16px 60px;}
.hidden{display:none !important;}
button{font-family:inherit; cursor:pointer;}
button:focus-visible, a:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }

/* HOME */
.hero{display:flex; align-items:center; gap:14px; margin:10px 0 20px;}
.hero-bot{width:76px; height:92px; flex:none;}
.hero h1{font-size:2.1rem; margin:0; color:var(--accent);}
.hero p{margin:4px 0 0; color:var(--ink-soft); font-size:0.95rem;}
.lesson-grid{display:grid; gap:14px;}
.lesson-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px 18px; display:flex; align-items:center; gap:14px; box-shadow:var(--shadow);
  text-align:left; width:100%;
}
.lesson-emoji{font-size:2rem; flex:none; width:52px; height:52px; border-radius:14px;
  background:var(--surface2); display:flex; align-items:center; justify-content:center;}
.lesson-info{flex:1; min-width:0;}
.lesson-info h3{margin:0 0 2px; font-size:1.15rem;}
.lesson-info p{margin:0; color:var(--ink-soft); font-size:0.85rem;}
.stars{margin-top:6px; font-size:0.95rem; letter-spacing:2px;}
.star-on{color:var(--gold);}
.star-off{color:var(--border);}
.go-btn{
  flex:none; background:var(--accent); color:var(--accent-ink); border:none; border-radius:12px;
  padding:10px 16px; font-weight:800; font-size:0.9rem;
}

/* FLASHCARDS */
.screen-head{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
.back-btn{background:none; border:none; color:var(--accent); font-weight:800; font-size:0.95rem; padding:6px 4px;}
.screen-head h2{margin:0; font-size:1.4rem; flex:1;}
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  min-height:260px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:32px 24px; box-shadow:var(--shadow); gap:14px;
}
.card-icon{font-size:2.6rem;}
.card-icon.has-art{font-size:0; line-height:0;}
.money-group{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:10px;}
.money-group svg{display:block;}
.q-art{margin:2px 0 14px;}
.card-term{font-family:'Lilita One',cursive; font-size:1.6rem; color:var(--accent);}
.card-def{font-size:1.05rem; color:var(--ink-soft); line-height:1.5;}
.card-nav{display:flex; justify-content:space-between; align-items:center; margin-top:16px; gap:10px;}
.nav-btn{
  background:var(--surface2); color:var(--ink); border:1px solid var(--border); border-radius:12px;
  padding:12px 18px; font-weight:700;
}
.nav-btn:disabled{opacity:0.4; cursor:default;}
.dots{display:flex; gap:6px;}
.dot{width:8px; height:8px; border-radius:50%; background:var(--border);}
.dot.active{background:var(--accent);}
.primary-btn{
  background:var(--accent); color:var(--accent-ink); border:none; border-radius:14px;
  padding:14px 22px; font-weight:800; font-size:1rem; width:100%; margin-top:18px;
}

/* QUIZ */
.quiz-top{display:flex; align-items:center; gap:14px; margin-bottom:16px;}
.progress-bar{flex:1; height:10px; background:var(--surface2); border-radius:6px; overflow:hidden;}
.progress-fill{height:100%; background:var(--accent); transition:width .3s;}
.quiz-bot{width:44px; height:52px; flex:none;}
.q-text{font-size:1.2rem; font-weight:800; margin:6px 0 16px;}
.options{display:grid; gap:10px;}
.option{
  background:var(--surface); border:2px solid var(--border); border-radius:14px; padding:14px 16px;
  text-align:left; font-size:1rem; font-weight:600; color:var(--ink);
}
.option.correct{border-color:var(--good); background:color-mix(in srgb, var(--good) 14%, var(--surface));}
.option.incorrect{border-color:var(--bad); background:color-mix(in srgb, var(--bad) 14%, var(--surface));}
.option:disabled{cursor:default;}
.feedback{margin-top:14px; padding:14px 16px; border-radius:14px; font-size:0.95rem; line-height:1.5;}
.feedback.good{background:color-mix(in srgb, var(--good) 16%, var(--surface)); color:var(--ink);}
.feedback.bad{background:color-mix(in srgb, var(--bad) 16%, var(--surface)); color:var(--ink);}
.feedback strong{display:block; margin-bottom:4px; font-family:'Lilita One',cursive; font-size:1.05rem;}

/* RESULTS */
.results{text-align:center; padding:20px 10px;}
.results-bot{width:160px; height:190px; margin:0 auto 14px;}
.results h2{font-size:1.8rem; color:var(--accent); margin:0 0 4px;}
.score-line{font-size:1.1rem; color:var(--ink-soft); margin-bottom:10px;}
.results-stars{font-size:2rem; letter-spacing:8px; margin-bottom:18px;}
.points-total{display:inline-flex; align-items:center; gap:6px; background:color-mix(in srgb, var(--gold) 30%, var(--surface)); color:var(--ink); font-weight:800; font-size:0.85rem; padding:6px 14px; border-radius:999px; margin-top:8px;}
.points-live{font-size:0.85rem; font-weight:800; color:var(--ink); white-space:nowrap; margin-left:auto;}
.points-live .streak{color:var(--bad); margin-left:4px;}
.points-earned{font-size:1rem; font-weight:800; color:var(--ink); margin-bottom:4px;}
.missed-review{display:none; text-align:left; margin:0 0 18px; padding-top:16px; border-top:1px solid var(--border);}
.missed-review.show{display:block;}
.missed-review h3{font-size:1rem; font-family:'Lilita One',cursive; font-weight:400; color:var(--ink); margin:0 0 10px; text-align:center;}
.missed-list{max-height:340px; overflow-y:auto; padding-right:2px;}
.missed-item{background:var(--surface2); border-radius:12px; padding:12px 14px; margin-bottom:10px;}
.missed-item .missed-q{font-weight:700; color:var(--ink); margin:0 0 4px; line-height:1.4; font-size:0.96rem;}
.missed-item .missed-explain{color:var(--ink-soft); margin:0; line-height:1.4; font-size:0.9rem;}
.results-actions{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
.secondary-btn{
  background:var(--surface2); color:var(--ink); border:1px solid var(--border); border-radius:14px;
  padding:12px 20px; font-weight:700;
}

/* bot pieces */
.piece{opacity:0; transform:scale(0.6); transform-origin:center; transition:opacity .35s ease, transform .35s ease;}
.piece.on{opacity:1; transform:scale(1);}

/* NUMBER LINE */
.nline-box{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow);}
.mode-badge{display:inline-block; font-size:0.78rem; font-weight:800; padding:4px 12px; border-radius:999px; margin-bottom:12px;}
.mode-badge.guided{background:var(--surface2); color:var(--accent);}
.mode-badge.challenge{background:color-mix(in srgb, var(--coral) 18%, var(--surface)); color:var(--coral);}
.nline-svg{width:100%; margin-bottom:14px;}
.nline-svg svg{width:100%; height:auto; display:block;}
.nline-input-row{display:flex; align-items:center; gap:10px; font-size:1.15rem; font-weight:800; flex-wrap:wrap;}
.nline-input{width:64px; padding:10px; font-size:1.1rem; font-weight:800; text-align:center; border:2px solid var(--border); border-radius:10px; font-family:inherit; color:var(--ink); background:var(--bg);}
.nline-input.correct{border-color:var(--good); background:color-mix(in srgb, var(--good) 14%, var(--bg));}
.nline-input.incorrect{border-color:var(--bad); background:color-mix(in srgb, var(--bad) 14%, var(--bg));}
.check-btn{background:var(--accent); color:var(--accent-ink); border:none; border-radius:10px; padding:10px 18px; font-weight:800; font-size:0.95rem;}
.check-btn:disabled{opacity:0.5;}

/* FINAL EXAM CARD */
.final-card{border-color:var(--gold); background:linear-gradient(135deg, var(--surface2), var(--surface));}
.final-badge{
  display:inline-block; background:var(--gold); color:#3A2900; font-size:0.68rem; font-weight:800;
  padding:2px 10px; border-radius:999px; margin-bottom:4px; letter-spacing:0.03em;
}

/* 3-up lesson map on wide screens, so every lesson shows at once.
   Only the lesson list widens -- flashcards, quiz and results stay narrow. */
@media (min-width:900px){
  .app{max-width:1120px;}
  .app section:not(#screen-home){max-width:720px; margin-left:auto; margin-right:auto;}
  #screen-home > *:not(.lesson-grid){max-width:720px; margin-left:auto; margin-right:auto;}
  #screen-home .lesson-grid{grid-template-columns:repeat(3, minmax(0,1fr)); align-items:stretch;}
  #screen-home .lesson-card{flex-direction:column; align-items:stretch; gap:10px; height:100%;}
  #screen-home .lesson-emoji{align-self:flex-start;}
  #screen-home .lesson-info{flex:1;}
  #screen-home .go-btn{width:100%; text-align:center;}
}
</style>

<div class="app">

    <div id="q-feedback"></div>
    <button class="primary-btn hidden" id="q-next-btn" onclick="nextQuestion()">Next &rarr;</button>
  </section>

  <!-- RESULTS -->
  <section id="screen-results" class="hidden">
    <div class="results">
      <svg class="results-bot" viewBox="0 0 200 240" id="results-bot-svg"></svg>
      <h2 id="results-heading"></h2>
      <div class="score-line" id="results-score"></div>
      <div class="points-earned" id="points-earned"></div>
      <div class="results-stars" id="results-stars"></div>
      <div class="missed-review" id="missed-review"></div>
      <div class="results-actions">
        <button class="primary-btn" style="width:auto" onclick="retryLesson()">Try Again</button>
        <button class="secondary-btn" onclick="goHome()">Lesson Map</button>
      </div>
    </div>
  </section>

</div>

<script>
/* ---- Philippine money art -------------------------------------------------
   Coins are drawn to true relative diameter (5 sentimo 16mm up to 20 piso
   30mm), so size is a real clue the way it is in a coin purse -- on this
   series the bigger the coin, the more it is worth. Bills are drawn larger
   than every coin but not to true scale: a real note is 160mm across, which
   would leave the coins too small to read. */
const COIN_SPECS = {
  '5s' : {mm:16, num:'5',  unit:'SENTIMO', name:'5-centavo coin',  sun:true},
  '25s': {mm:20, num:'25', unit:'SENTIMO', name:'25-centavo coin', sun:true},
  '1p' : {mm:23, num:'1',  unit:'PISO',    name:'1-peso coin'},
  '5p' : {mm:25, num:'5',  unit:'PISO',    name:'5-peso coin', sides:9},
  '10p': {mm:27, num:'10', unit:'PISO',    name:'10-peso coin'},
  '20p': {mm:30, num:'20', unit:'PISO',    name:'20-peso coin', bimetal:true},
};

const BILL_SPECS = {
  '50'  : {num:'50',   ink:'#B14A36', name:'50-peso bill'},
  '100' : {num:'100',  ink:'#7E5FA4', name:'100-peso bill'},
  '200' : {num:'200',  ink:'#2F7F52', name:'200-peso bill'},
  '500' : {num:'500',  ink:'#B8860B', name:'500-peso bill'},
  '1000': {num:'1000', ink:'#2F5F92', name:'1000-peso bill'},
};

function polygonPoints(cx, cy, r, sides){
  const pts = [];
  for(let i=0;i<sides;i++){
    const a = (Math.PI*2*i/sides) - Math.PI/2;
    pts.push((cx + r*Math.cos(a)).toFixed(1) + ',' + (cy + r*Math.sin(a)).toFixed(1));
  }
  return pts.join(' ');
}

function sunMotif(){
  let rays = '';
  for(let i=0;i<8;i++){
    const a = Math.PI*2*i/8;
    const x1 = 50 + 7.5*Math.cos(a), y1 = 27 + 7.5*Math.sin(a);
    const x2 = 50 + 11*Math.cos(a),  y2 = 27 + 11*Math.sin(a);
    rays += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#8B97A3" stroke-width="2" stroke-linecap="round"/>`;
  }
  return `<g opacity="0.75"><circle cx="50" cy="27" r="5.5" fill="#8B97A3"/>${rays}</g>`;
}

function coinSvg(key, pxPerMm){
  const s = COIN_SPECS[key];
  const px = Math.round(s.mm * pxPerMm);
  const silver = '#D6DCE2', rim = '#98A3AE', ink = '#3D4B59';

  const body = s.sides
    ? `<polygon points="${polygonPoints(50,50,47,s.sides)}" fill="${silver}" stroke="${rim}" stroke-width="2.5" stroke-linejoin="round"/>`
    : `<circle cx="50" cy="50" r="47" fill="${s.bimetal ? '#C2865A' : silver}" stroke="${rim}" stroke-width="2.5"/>`;

  const inner = s.bimetal
    ? `<circle cx="50" cy="50" r="33" fill="${silver}" stroke="#A8B2BC" stroke-width="2"/>`
    : `<circle cx="50" cy="50" r="40" fill="none" stroke="#B9C1C9" stroke-width="1.5"/>`;

  const numY    = s.bimetal ? 56 : (s.sun ? 62 : 58);
  const numSize = s.bimetal ? 30 : (s.sun ? 32 : 40);
  const unitY   = s.bimetal ? 70 : 78;

  return `<svg class="coin" viewBox="0 0 100 100" width="${px}" height="${px}" role="img" aria-label="${s.name}">`
    + body + inner
    + (s.sun ? sunMotif() : '')
    + `<text x="50" y="${numY}" text-anchor="middle" font-family="Mulish, sans-serif" font-size="${numSize}" font-weight="800" fill="${ink}">${s.num}</text>`
    + `<text x="50" y="${unitY}" text-anchor="middle" font-family="Mulish, sans-serif" font-size="12" font-weight="700" fill="#5A6875">${s.unit}</text>`
    + `</svg>`;
}

function billSvg(key, w){
  const b = BILL_SPECS[key];
  const h = Math.round(w * 66 / 160);
  const numSize = b.num.length > 3 ? 18 : 24;
  return `<svg class="bill" viewBox="0 0 160 66" width="${w}" height="${h}" role="img" aria-label="${b.name}">`
    + `<rect x="2" y="2" width="156" height="62" rx="6" fill="#FCF8F0" stroke="${b.ink}" stroke-width="2.5"/>`
    + `<rect x="8" y="8" width="144" height="50" rx="4" fill="none" stroke="${b.ink}" stroke-width="1" opacity="0.4"/>`
    + `<ellipse cx="38" cy="36" rx="16" ry="19" fill="${b.ink}" opacity="0.13"/>`
    + `<circle cx="38" cy="29" r="7" fill="${b.ink}" opacity="0.3"/>`
    + `<path d="M25 48 q13 -12 26 0 z" fill="${b.ink}" opacity="0.3"/>`
    + `<text x="80" y="17" text-anchor="middle" font-family="Mulish, sans-serif" font-size="6.5" font-weight="700" letter-spacing="0.6" fill="${b.ink}" opacity="0.85">REPUBLIKA NG PILIPINAS</text>`
    + `<text x="112" y="43" text-anchor="middle" font-family="Mulish, sans-serif" font-size="${numSize}" font-weight="800" fill="${b.ink}">&#8369;${b.num}</text>`
    + `<text x="112" y="54" text-anchor="middle" font-family="Mulish, sans-serif" font-size="7.5" font-weight="700" letter-spacing="1.4" fill="${b.ink}" opacity="0.85">PISO</text>`
    + `</svg>`;
}

/* A row of money to count. Bills first, then coins biggest to smallest --
   the order the lesson teaches for adding them up. */
function moneyGroup(items, opt){
  const o = opt || {};
  const coinPx = o.coinPx || 3.0, billW = o.billW || 150;
  const html = items.map(k => BILL_SPECS[k] ? billSvg(k, billW) : coinSvg(k, coinPx)).join('');
  return `<div class="money-group">${html}</div>`;
}

function allBills(w){ return `<div class="money-group">` + Object.keys(BILL_SPECS).map(k=>billSvg(k, w||96)).join('') + `</div>`; }
function allCoins(pxPerMm){ return `<div class="money-group">` + Object.keys(COIN_SPECS).map(k=>coinSvg(k, pxPerMm||3.4)).join('') + `</div>`; }


const LESSONS = [
  {
    id:'blocks', emoji:'🧱', title:'Base-Ten Blocks', subtitle:'Ones, Tens, Hundreds, and Thousands',
    flashcards:[
      {icon:'🔲', term:'1 One (Unit)', def:'The smallest base-ten block. Just 1 tiny square.'},
      {icon:'📏', term:'1 Ten (Rod)', def:'1 rod = 10 ones lined up together.'},
      {icon:'🟪', term:'1 Hundred (Flat)', def:'1 flat = 10 rods, or 10 tens, put side by side.'},
      {icon:'🧊', term:'1 Thousand (Block)', def:'1 big block = 10 flats, or 10 hundreds, stacked up.'},
      {icon:'🔢', term:'Example: 1109', def:'1109 = 1 thousand, 1 hundred, 0 tens, 9 ones.'},
    ],
    quiz:[
      {q:'How many ones make 1 ten?', options:['5','10','1','100'], correct:1, explain:'A rod (ten) is made of 10 small unit blocks lined up.'},
      {q:'How many tens make 1 hundred?', options:['1','100','10','5'], correct:2, explain:'A flat (hundred) is made of 10 rods (tens) side by side.'},
      {q:'How many hundreds make 1 thousand?', options:['10','1000','100','1'], correct:0, explain:'A thousand block is made of 10 flats (hundreds) stacked up.'},
      {q:'True or False: 1 rod represents 1 ten.', options:['True','False'], correct:0, explain:'Yes! A rod is 10 ones joined together, so it equals 1 ten.'},
      {q:'The number 509 is made of how many hundreds and ones?', options:['5 hundreds, 9 ones','5 tens, 9 ones','9 hundreds, 5 ones','5 hundreds, 0 ones'], correct:0, explain:'509 = 5 flats (hundreds) + 0 rods (tens) + 9 units (ones).'},

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function prepareQuestion(q){
  const order = shuffle(q.options.map((_,i)=>i));
  const options = order.map(i=>q.options[i]);
  const correct = order.indexOf(q.correct);
  return {q:q.q, options, correct, explain:q.explain, art:q.art};
}
function buildQuizSet(lesson){
  if(lesson.generate) return lesson.generate(8);
  return shuffle(lesson.quiz).map(prepareQuestion);
}

function numberlineExplain(start, jumps){
  const seq = [];
  for(let k=1;k<=jumps;k++) seq.push(start+k);
  return `Start at ${start} and take ${jumps} jumps of +1: ${seq.join(', ')}. You land on ${start+jumps}, so ${start} + ${jumps} = ${start+jumps}.`;
}
function genNumberlineSet(n){
  const qs = [];
  for(let i=0;i<n;i++){
    const jumps = 3 + Math.floor(Math.random()*7);
    const start = Math.floor(Math.random()*(100-jumps+1));
    const mode = i < n/2 ? 'labeled' : 'blank';
    qs.push({type:'numberline', start, jumps, mode, explain:numberlineExplain(start,jumps)});
  }
  return qs;
}

/* ---- Number Line ---- */
function numberLineSVG(start, jumps, mode, revealed){
  const n = jumps;
  const W = 640, padX = 36, baseY = revealed ? 92 : 60, H = revealed ? 132 : 92;
  const x = i => padX + i * (W - 2*padX) / n;
  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  if(revealed){
    for(let i=0;i<n;i++){
      const x1=x(i), x2=x(i+1), midX=(x1+x2)/2, peakY=baseY-34;
      svg += `<path d="M${x1},${baseY} Q${midX},${peakY} ${x2},${baseY}" fill="none" stroke="var(--coral)" stroke-width="2.5"/>`;
      svg += `<text x="${midX}" y="${peakY-6}" text-anchor="middle" font-size="13" font-weight="800" fill="var(--coral)">+1</text>`;
    }
  }
  svg += `<line x1="${x(0)}" y1="${baseY}" x2="${x(n)}" y2="${baseY}" stroke="var(--ink-soft)" stroke-width="2"/>`;
  for(let i=0;i<=n;i++){
    const isLast = i === n;
    const showLabel = revealed || i===0 || (mode==='labeled' && !isLast);
    svg += `<line x1="${x(i)}" y1="${baseY-6}" x2="${x(i)}" y2="${baseY+6}" stroke="var(--ink-soft)" stroke-width="2"/>`;
    if(showLabel){
      svg += `<text x="${x(i)}" y="${baseY+22}" text-anchor="middle" font-size="12" font-weight="700" fill="${isLast?'var(--accent)':'var(--ink)'}">${start+i}</text>`;
    } else if(isLast){
      svg += `<text x="${x(i)}" y="${baseY+22}" text-anchor="middle" font-size="16" font-weight="800" fill="var(--accent)">?</text>`;
    }
  }
  svg += `</svg>`;
  return svg;
}

function renderNumberlineQuestion(q){
  const badge = document.getElementById('nline-badge');
  badge.textContent = q.mode==='labeled' ? '🔍 Guided: watch the numbers grow as you count on' : '🧠 Challenge: figure out the next numbers in your head!';
  badge.className = 'mode-badge ' + (q.mode==='labeled' ? 'guided' : 'challenge');
  document.getElementById('nline-svg').innerHTML = numberLineSVG(q.start, q.jumps, q.mode, false);
  document.getElementById('nline-equation').textContent = `${q.start} + ${q.jumps} =`;
  const input = document.getElementById('nline-input');
  input.value = '';
  input.disabled = false;
  input.className = 'nline-input';
  input.onkeydown = (e)=>{ if(e.key==='Enter') checkNumberline(); };
  document.getElementById('nline-check').disabled = false;
  setTimeout(()=>input.focus(), 50);
}

function checkNumberline(){
  if(answered) return;
  const q = currentQuizSet[quizIdx];
  const total = currentQuizSet.length;
  const input = document.getElementById('nline-input');
  const val = parseInt(input.value, 10);
  const correctAns = q.start + q.jumps;
  answered = true;
  const correct = val === correctAns;
  if(correct){
    quizScore++;
    streak++;
    if(streak > bestStreak) bestStreak = streak;
    const pts = POINTS_PER_CORRECT + (streak >= STREAK_BONUS_AT ? STREAK_BONUS : 0);
    sessionPoints += pts;
    totalPoints += pts;
    saveTotalPoints(totalPoints);
  } else {
    streak = 0;
    missedQuestions.push({ q: `${q.start} + ${q.jumps} = ?`, explain: q.explain });
  }
  updatePointsLive();
  input.disabled = true;
  input.classList.add(correct ? 'correct' : 'incorrect');
  document.getElementById('nline-check').disabled = true;
  document.getElementById('nline-svg').innerHTML = numberLineSVG(q.start, q.jumps, q.mode, true);
  renderBot(document.getElementById('quiz-bot-svg'), Math.round((quizScore/total)*8));
  const fb = document.getElementById('q-feedback');
  fb.innerHTML = `<div class="feedback ${correct?'good':'bad'}"><strong>${correct?'Correct! 🎉':'Not quite — the answer is '+correctAns+'.'}</strong>${q.explain}</div>`;
  document.getElementById('q-next-btn').classList.remove('hidden');
}

function renderBot(svgEl, n){
  svgEl.innerHTML = botMarkup();
  svgEl.querySelectorAll('.piece').forEach(p=>{
    if(parseInt(p.dataset.n) <= n) p.classList.add('on');
  });
}

function starsFor(pct){
  if(pct >= 1) return 3;
  if(pct >= 0.8) return 2;
  if(pct >= 0.5) return 1;
  return 0;
}

function renderHome(){
  document.getElementById('points-total-badge').textContent = '⭐ ' + totalPoints + ' points earned';
  renderBot(document.getElementById('hero-bot-svg'), 8);
  const grid = document.getElementById('lesson-grid');
  grid.innerHTML = '';

  const finalTotal = LESSONS.length * FINAL_EXAM_PER_LESSON;
  const finalBest = progress['final'] || 0;
  const finalCard = document.createElement('button');
  finalCard.className = 'lesson-card final-card';
  finalCard.onclick = ()=>startFinalExam();
  finalCard.innerHTML = `
    <div class="lesson-emoji">🏆</div>
    <div class="lesson-info">
      <span class="final-badge">Mock Exam</span>
      <h3>Final Mock Exam</h3>
      <p>${finalTotal} mixed questions from every lesson</p>
      <div class="stars">${[1,2,3].map(s=>`<span class="${s<=starsFor(finalBest/finalTotal)?'star-on':'star-off'}">★</span>`).join('')}</div>
    </div>
    <div class="go-btn">${finalBest>0?'Retry':'Start'}</div>
  `;
  grid.appendChild(finalCard);

  LESSONS.forEach((lesson, i)=>{
    const total = lesson.generate ? 8 : lesson.quiz.length;
    const best = progress[lesson.id] || 0;
    const stars = starsFor(best/total);
    const card = document.createElement('button');
    card.className = 'lesson-card';
    card.onclick = ()=>openLesson(i);
    card.innerHTML = `
      <div class="lesson-emoji">${lesson.emoji}</div>

      <div class="go-btn">${best>0?'Review':'Start'}</div>
    `;
    grid.appendChild(card);
  });
  showScreen(homeScreen);
}

  currentLessonIdx = i;
  cardIdx = 0;
  renderCard();
  showScreen(cardsScreen);
}

function renderCard(){
  const lesson = LESSONS[currentLessonIdx];
  document.getElementById('cards-title').textContent = lesson.title;
  const fc = lesson.flashcards[cardIdx];
  const cardIcon = document.getElementById('card-icon');
  if(fc.art){ cardIcon.innerHTML = fc.art; cardIcon.classList.add('has-art'); }
  else { cardIcon.textContent = fc.icon; cardIcon.classList.remove('has-art'); }
  document.getElementById('card-term').textContent = fc.term;
  document.getElementById('card-def').textContent = fc.def;
  document.getElementById('card-prev').disabled = cardIdx === 0;
  document.getElementById('card-next').disabled = cardIdx === lesson.flashcards.length - 1;
  const dots = document.getElementById('card-dots');
  dots.innerHTML = '';
  lesson.flashcards.forEach((_, idx)=>{
    const d = document.createElement('div');
    d.className = 'dot' + (idx === cardIdx ? ' active' : '');
    dots.appendChild(d);
  });
}

function cardStep(dir){
  const lesson = LESSONS[currentLessonIdx];
  cardIdx = Math.max(0, Math.min(lesson.flashcards.length - 1, cardIdx + dir));
  renderCard();
}

function startQuiz(){
  const lesson = LESSONS[currentLessonIdx];
  currentQuizSet = buildQuizSet(lesson);
  currentQuizMeta = {id: lesson.id, title: lesson.title};
  quizIdx = 0;
  quizScore = 0;
  missedQuestions = [];
  sessionPoints = 0; streak = 0; bestStreak = 0;
  renderQuestion();
  showScreen(quizScreen);
}

function startFinalExam(){
  let qs = [];
  LESSONS.forEach(l=>{
    if(l.generate){
      qs = qs.concat(l.generate(FINAL_EXAM_PER_LESSON));
    } else {
      qs = qs.concat(shuffle(l.quiz).slice(0, FINAL_EXAM_PER_LESSON).map(prepareQuestion));
    }
  });
  currentQuizSet = shuffle(qs);
  currentQuizMeta = {id:'final', title:'Final Mock Exam'};
  quizIdx = 0;
  quizScore = 0;
  missedQuestions = [];
  sessionPoints = 0; streak = 0; bestStreak = 0;
  renderQuestion();
  showScreen(quizScreen);
}

function renderQuestion(){
  answered = false;
  document.getElementById('quiz-title').textContent = currentQuizMeta.title;
  updatePointsLive();
  const total = currentQuizSet.length;
  document.getElementById('quiz-progress').style.width = `${(quizIdx/total)*100}%`;
  renderBot(document.getElementById('quiz-bot-svg'), Math.round((quizScore/total)*8));
  const q = currentQuizSet[quizIdx];
  document.getElementById('q-feedback').innerHTML = '';
  document.getElementById('q-next-btn').classList.add('hidden');

  if(q.type === 'numberline'){
    document.getElementById('q-text').textContent = `Question ${quizIdx+1} of ${total}: Find the sum.`;
    document.getElementById('q-art').classList.add('hidden');
    document.getElementById('q-options').classList.add('hidden');
    document.getElementById('q-numberline').classList.remove('hidden');
    renderNumberlineQuestion(q);
    return;
  }

  document.getElementById('q-numberline').classList.add('hidden');
  document.getElementById('q-options').classList.remove('hidden');
  document.getElementById('q-text').textContent = `Question ${quizIdx+1} of ${total}: ${q.q}`;
  const qArt = document.getElementById('q-art');
  if(q.art){ qArt.innerHTML = q.art; qArt.classList.remove('hidden'); }
  else { qArt.innerHTML = ''; qArt.classList.add('hidden'); }
  const opts = document.getElementById('q-options');
  opts.innerHTML = '';
  q.options.forEach((opt, idx)=>{
    const b = document.createElement('button');
    b.className = 'option';
    b.textContent = opt;
    b.onclick = ()=>selectOption(idx);
    opts.appendChild(b);
  });
}

function selectOption(idx){
  if(answered) return;
  answered = true;
  const q = currentQuizSet[quizIdx];
  const total = currentQuizSet.length;
  const buttons = document.querySelectorAll('#q-options .option');
  buttons.forEach((b, i)=>{
    b.disabled = true;
    if(i === q.correct) b.classList.add('correct');
    else if(i === idx) b.classList.add('incorrect');
  });
  const correct = idx === q.correct;
  if(correct){
    quizScore++;
    streak++;
    if(streak > bestStreak) bestStreak = streak;
    const pts = POINTS_PER_CORRECT + (streak >= STREAK_BONUS_AT ? STREAK_BONUS : 0);
    sessionPoints += pts;
    totalPoints += pts;
    saveTotalPoints(totalPoints);
  } else {
    streak = 0;
    missedQuestions.push({ q: q.q, explain: q.explain });
  }
  updatePointsLive();
  renderBot(document.getElementById('quiz-bot-svg'), Math.round((quizScore/total)*8));
  const fb = document.getElementById('q-feedback');
  fb.innerHTML = `<div class="feedback ${correct?'good':'bad'}"><strong>${correct?'Correct! 🎉':'Not quite.'}</strong>${q.explain}</div>`;
  document.getElementById('q-next-btn').classList.remove('hidden');
}

function nextQuestion(){
  quizIdx++;
  if(quizIdx >= currentQuizSet.length){
    finishQuiz();
  } else {
    renderQuestion();
  }
}

function finishQuiz(){
  const total = currentQuizSet.length;
  const best = Math.max(progress[currentQuizMeta.id] || 0, quizScore);
  progress[currentQuizMeta.id] = best;
  saveProgress(progress);
  renderResults(total);
  showScreen(resultsScreen);
}

function renderResults(total){
  renderBot(document.getElementById('results-bot-svg'), Math.round((quizScore/total)*8));
  const stars = starsFor(quizScore/total);
  document.getElementById('results-heading').textContent =
    stars === 3 ? 'Block Bot Complete!' : stars > 0 ? 'Great Progress!' : 'Keep Building!';
  document.getElementById('results-score').textContent = `You scored ${quizScore} out of ${total} on ${currentQuizMeta.title}`;
  let ptsLine = `⭐ +${sessionPoints} points this round`;
  if(bestStreak >= STREAK_BONUS_AT) ptsLine += ` · 🔥 best streak: ${bestStreak} in a row!`;
  document.getElementById('points-earned').textContent = ptsLine;
  document.getElementById('results-stars').innerHTML = [1,2,3].map(s=>`<span class="${s<=stars?'star-on':'star-off'}">★</span>`).join('');
  const reviewEl = document.getElementById('missed-review');
  if(missedQuestions.length){
    reviewEl.innerHTML = '<h3>Questions to Review</h3><div class="missed-list">' +
      missedQuestions.map(m => `<div class="missed-item"><p class="missed-q">${m.q}</p><p class="missed-explain">${m.explain}</p></div>`).join('') +
      '</div>';
  } else {
    reviewEl.innerHTML = '';
  }
  reviewEl.classList.toggle('show', missedQuestions.length > 0);
}

function retryLesson(){
  if(currentQuizMeta.id === 'final'){ startFinalExam(); }
  else { startQuiz(); }
}

renderHome();
</script>
