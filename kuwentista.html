<title>Kuwentista</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF6EC; --surface:#FFFFFF; --surface2:#FBEADF;
  --ink:#2B2440; --ink-soft:#6A6083;
  --accent:#D6467E; --accent-ink:#FFFFFF;
  --gold:#F2A83C; --navy:#2C4A6E;
  --good:#2F9C5D; --bad:#D8433A;
  --border:#F0DCC7;
  --shadow: 0 8px 24px rgba(214,70,126,0.14);
  --radius:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1D1626; --surface:#2A2036; --surface2:#352840;
    --ink:#F5EEFB; --ink-soft:#C3B6D6;
    --accent:#F073A0; --accent-ink:#1D1626;
    --gold:#F5C168; --navy:#7FA6D6;
    --good:#4FCB84; --bad:#F0766B;
    --border:#443652;
    --shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
}
:root[data-theme="dark"]{
  --bg:#1D1626; --surface:#2A2036; --surface2:#352840;
  --ink:#F5EEFB; --ink-soft:#C3B6D6;
  --accent:#F073A0; --accent-ink:#1D1626;
  --gold:#F5C168; --navy:#7FA6D6;
  --good:#4FCB84; --bad:#F0766B;
  --border:#443652;
  --shadow: 0 8px 24px rgba(0,0,0,0.4);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Poppins',system-ui,sans-serif;
  min-height:100vh;
}
h1,h2,h3,.display{font-family:'Chewy',cursive; font-weight:400; letter-spacing:0.01em;}
.app{max-width:720px; margin:0 auto; padding:20px 16px 60px;}
.hidden{display:none !important;}
button{font-family:inherit; cursor:pointer;}
button:focus-visible, a:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }

/* HOME */
.hero{display:flex; align-items:center; gap:14px; margin:10px 0 20px;}
.hero-book{width:84px; height:84px; flex:none;}
.hero h1{font-size:2.2rem; margin:0; color:var(--accent);}
.hero p{margin:4px 0 0; color:var(--ink-soft); font-size:0.95rem;}
.lesson-grid{display:grid; gap:14px;}
.lesson-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px 18px; display:flex; align-items:center; gap:14px; box-shadow:var(--shadow);
  text-align:left; width:100%;
}
.lesson-emoji{font-size:2rem; flex:none; width:52px; height:52px; border-radius:14px;
  background:var(--surface2); display:flex; align-items:center; justify-content:center;}
.lesson-info{flex:1; min-width:0;}
.lesson-info h3{margin:0 0 2px; font-size:1.1rem;}
.lesson-info p{margin:0; color:var(--ink-soft); font-size:0.85rem;}
.stars{margin-top:6px; font-size:0.95rem; letter-spacing:2px;}
.star-on{color:var(--gold);}
.star-off{color:var(--border);}
.go-btn{
  flex:none; background:var(--accent); color:var(--accent-ink); border:none; border-radius:12px;
  padding:10px 16px; font-weight:700; font-size:0.85rem;
}

/* FLASHCARDS */
.screen-head{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
.back-btn{background:none; border:none; color:var(--accent); font-weight:700; font-size:0.95rem; padding:6px 4px;}
.screen-head h2{margin:0; font-size:1.35rem; flex:1;}
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  min-height:260px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:32px 24px; box-shadow:var(--shadow); gap:14px;
}
.card-icon{font-size:2.6rem;}
.card-term{font-family:'Chewy',cursive; font-size:1.5rem; color:var(--accent);}
.card-def{font-size:1.02rem; color:var(--ink-soft); line-height:1.5;}
.card-nav{display:flex; justify-content:space-between; align-items:center; margin-top:16px; gap:10px;}
.nav-btn{
  background:var(--surface2); color:var(--ink); border:1px solid var(--border); border-radius:12px;
  padding:12px 18px; font-weight:600;
}
.nav-btn:disabled{opacity:0.4; cursor:default;}
.dots{display:flex; gap:6px;}
.dot{width:8px; height:8px; border-radius:50%; background:var(--border);}
.dot.active{background:var(--accent);}
.primary-btn{
  background:var(--accent); color:var(--accent-ink); border:none; border-radius:14px;
  padding:14px 22px; font-weight:700; font-size:1rem; width:100%; margin-top:18px;
}

/* QUIZ */
.quiz-top{display:flex; align-items:center; gap:14px; margin-bottom:16px;}
.progress-bar{flex:1; height:10px; background:var(--surface2); border-radius:6px; overflow:hidden;}
.progress-fill{height:100%; background:var(--accent); transition:width .3s;}
.quiz-book{width:46px; height:46px; flex:none;}
.q-text{font-size:1.15rem; font-weight:700; margin:6px 0 16px;}
.options{display:grid; gap:10px;}
.option{
  background:var(--surface); border:2px solid var(--border); border-radius:14px; padding:14px 16px;
  text-align:left; font-size:1rem; font-weight:600; color:var(--ink);
}
.option.correct{border-color:var(--good); background:color-mix(in srgb, var(--good) 14%, var(--surface));}
.option.incorrect{border-color:var(--bad); background:color-mix(in srgb, var(--bad) 14%, var(--surface));}
.option:disabled{cursor:default;}
.feedback{margin-top:14px; padding:14px 16px; border-radius:14px; font-size:0.95rem; line-height:1.5;}
.feedback.good{background:color-mix(in srgb, var(--good) 16%, var(--surface)); color:var(--ink);}
.feedback.bad{background:color-mix(in srgb, var(--bad) 16%, var(--surface)); color:var(--ink);}
.feedback strong{display:block; margin-bottom:4px; font-family:'Chewy',cursive; font-size:1.05rem;}

/* RESULTS */
.results{text-align:center; padding:20px 10px;}
.results-book{width:180px; height:180px; margin:0 auto 14px;}
.results h2{font-size:1.75rem; color:var(--accent); margin:0 0 4px;}
.score-line{font-size:1.05rem; color:var(--ink-soft); margin-bottom:10px;}
.results-stars{font-size:2rem; letter-spacing:8px; margin-bottom:18px;}
.results-actions{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
.secondary-btn{
  background:var(--surface2); color:var(--ink); border:1px solid var(--border); border-radius:14px;
  padding:12px 20px; font-weight:600;
}

/* book pieces */
.piece{opacity:0; transform:scale(0.6); transform-origin:center; transition:opacity .35s ease, transform .35s ease;}
.piece.on{opacity:1; transform:scale(1);}
</style>

<div class="app">

  <!-- HOME -->
  <section id="screen-home">
    <div class="hero">
      <svg class="hero-book" viewBox="0 0 200 200" id="hero-book-svg"></svg>
      <div>
        <h1>Kuwentista</h1>
        <p>Alamin ang wikang Filipino, sagutan ang pagsusulit, at buuin ang iyong sariling kuwento pahina-pahina!</p>
      </div>
    </div>
    <div class="lesson-grid" id="lesson-grid"></div>
  </section>

  <!-- FLASHCARDS -->
  <section id="screen-cards" class="hidden">
    <div class="screen-head">
      <button class="back-btn" onclick="goHome()">&larr; Balik</button>
      <h2 id="cards-title"></h2>
    </div>
    <div class="card">
      <div class="card-icon" id="card-icon"></div>
      <div class="card-term" id="card-term"></div>
      <div class="card-def" id="card-def"></div>
    </div>
    <div class="card-nav">
      <button class="nav-btn" id="card-prev" onclick="cardStep(-1)">&larr; Balik</button>
      <div class="dots" id="card-dots"></div>
      <button class="nav-btn" id="card-next" onclick="cardStep(1)">Susunod &rarr;</button>
    </div>
    <button class="primary-btn" onclick="startQuiz()">Simulan ang Pagsusulit!</button>
  </section>

  <!-- QUIZ -->
  <section id="screen-quiz" class="hidden">
    <div class="screen-head">
      <button class="back-btn" onclick="goHome()">&larr; Balik</button>
      <h2 id="quiz-title"></h2>
    </div>
    <div class="quiz-top">
      <div class="progress-bar"><div class="progress-fill" id="quiz-progress"></div></div>
      <svg class="quiz-book" viewBox="0 0 200 200" id="quiz-book-svg"></svg>
    </div>
    <div class="q-text" id="q-text"></div>
    <div class="options" id="q-options"></div>
    <div id="q-feedback"></div>
    <button class="primary-btn hidden" id="q-next-btn" onclick="nextQuestion()">Susunod &rarr;</button>
  </section>

  <!-- RESULTS -->
  <section id="screen-results" class="hidden">
    <div class="results">
      <svg class="results-book" viewBox="0 0 200 200" id="results-book-svg"></svg>
      <h2 id="results-heading"></h2>
      <div class="score-line" id="results-score"></div>
      <div class="results-stars" id="results-stars"></div>
      <div class="results-actions">
        <button class="primary-btn" style="width:auto" onclick="retryLesson()">Ulitin</button>
        <button class="secondary-btn" onclick="goHome()">Balik sa Aralin</button>
      </div>
    </div>
  </section>

</div>

function renderBook(svgEl, n){
  svgEl.innerHTML = bookMarkup();
  svgEl.querySelectorAll('.piece').forEach(p=>{
    if(parseInt(p.dataset.n) <= n) p.classList.add('on');
  });
}

/* ---- State ---- */
let currentLessonIdx = 0;
let cardIdx = 0;
let quizIdx = 0;
let quizScore = 0;
let answered = false;

const homeScreen = document.getElementById('screen-home');
const cardsScreen = document.getElementById('screen-cards');
const quizScreen = document.getElementById('screen-quiz');
const resultsScreen = document.getElementById('screen-results');

function showScreen(el){
  [homeScreen, cardsScreen, quizScreen, resultsScreen].forEach(s=>s.classList.add('hidden'));
  el.classList.remove('hidden');
  window.scrollTo(0,0);
}

function starsFor(score){
  if(score >= 8) return 3;
  if(score >= 6) return 2;
  if(score >= 4) return 1;
  return 0;
}

function renderHome(){
  renderBook(document.getElementById('hero-book-svg'), 8);
  const grid = document.getElementById('lesson-grid');
  grid.innerHTML = '';
  LESSONS.forEach((lesson, i)=>{
    const best = progress[lesson.id] || 0;
    const stars = starsFor(best);
    const card = document.createElement('button');
    card.className = 'lesson-card';
    card.onclick = ()=>openLesson(i);
    card.innerHTML = `
      <div class="lesson-emoji">${lesson.emoji}</div>
      <div class="lesson-info">
        <h3>${lesson.title}</h3>
        <p>${lesson.subtitle}</p>
        <div class="stars">${[1,2,3].map(s=>`<span class="${s<=stars?'star-on':'star-off'}">★</span>`).join('')}</div>
      </div>
      <div class="go-btn">${best>0?'Balikan':'Simulan'}</div>
    `;
    grid.appendChild(card);
  });
  showScreen(homeScreen);
}

function goHome(){ renderHome(); }

function openLesson(i){
  currentLessonIdx = i;
  cardIdx = 0;
  renderCard();
  showScreen(cardsScreen);
}

function renderCard(){
  const lesson = LESSONS[currentLessonIdx];
  document.getElementById('cards-title').textContent = lesson.title;
  const fc = lesson.flashcards[cardIdx];
  document.getElementById('card-icon').textContent = fc.icon;
  document.getElementById('card-term').textContent = fc.term;
  document.getElementById('card-def').textContent = fc.def;
  document.getElementById('card-prev').disabled = cardIdx === 0;
  document.getElementById('card-next').disabled = cardIdx === lesson.flashcards.length - 1;
  const dots = document.getElementById('card-dots');
  dots.innerHTML = '';
  lesson.flashcards.forEach((_, idx)=>{
    const d = document.createElement('div');
    d.className = 'dot' + (idx === cardIdx ? ' active' : '');
    dots.appendChild(d);
  });
}

function cardStep(dir){
  const lesson = LESSONS[currentLessonIdx];
  cardIdx = Math.max(0, Math.min(lesson.flashcards.length - 1, cardIdx + dir));
  renderCard();
}

function startQuiz(){
  quizIdx = 0;
  quizScore = 0;
  renderQuestion();
  showScreen(quizScreen);
}

function renderQuestion(){
  const lesson = LESSONS[currentLessonIdx];
  answered = false;
  document.getElementById('quiz-title').textContent = lesson.title;
  const total = lesson.quiz.length;
  document.getElementById('quiz-progress').style.width = `${(quizIdx/total)*100}%`;
  renderBook(document.getElementById('quiz-book-svg'), quizScore);
  const q = lesson.quiz[quizIdx];
  document.getElementById('q-text').textContent = `Tanong ${quizIdx+1} sa ${total}: ${q.q}`;
  const opts = document.getElementById('q-options');
  opts.innerHTML = '';
  q.options.forEach((opt, idx)=>{
    const b = document.createElement('button');
    b.className = 'option';
    b.textContent = opt;
    b.onclick = ()=>selectOption(idx);
    opts.appendChild(b);
  });
  document.getElementById('q-feedback').innerHTML = '';
  document.getElementById('q-next-btn').classList.add('hidden');
}

function selectOption(idx){
  if(answered) return;
  answered = true;
  const lesson = LESSONS[currentLessonIdx];
  const q = lesson.quiz[quizIdx];
  const buttons = document.querySelectorAll('#q-options .option');
  buttons.forEach((b, i)=>{
    b.disabled = true;
    if(i === q.correct) b.classList.add('correct');
    else if(i === idx) b.classList.add('incorrect');
  });
  const correct = idx === q.correct;
  if(correct) quizScore++;
  renderBook(document.getElementById('quiz-book-svg'), quizScore);
  const fb = document.getElementById('q-feedback');
  fb.innerHTML = `<div class="feedback ${correct?'good':'bad'}"><strong>${correct?'Tama! 🎉':'Hindi tama.'}</strong>${q.explain}</div>`;
  document.getElementById('q-next-btn').classList.remove('hidden');
}

function nextQuestion(){
  const lesson = LESSONS[currentLessonIdx];
  quizIdx++;
  if(quizIdx >= lesson.quiz.length){
    finishQuiz();
  } else {
    renderQuestion();
  }
}

function finishQuiz(){
  const lesson = LESSONS[currentLessonIdx];
  const best = Math.max(progress[lesson.id] || 0, quizScore);
  progress[lesson.id] = best;
  saveProgress(progress);
  renderResults();
  showScreen(resultsScreen);
}

function renderResults(){
  const lesson = LESSONS[currentLessonIdx];
  renderBook(document.getElementById('results-book-svg'), quizScore);
  const stars = starsFor(quizScore);
  document.getElementById('results-heading').textContent =
    stars === 3 ? 'Kumpleto ang Kwento!' : stars > 0 ? 'Magaling!' : 'Magpatuloy Tayo!';
  document.getElementById('results-score').textContent = `Nakakuha ka ng ${quizScore} sa ${lesson.quiz.length} sa ${lesson.title}`;
  document.getElementById('results-stars').innerHTML = [1,2,3].map(s=>`<span class="${s<=stars?'star-on':'star-off'}">★</span>`).join('');
}

function retryLesson(){
  startQuiz();
}

renderHome();
</script>
