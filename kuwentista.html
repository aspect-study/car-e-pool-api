<html lang="fil">
<meta charset="utf-8">
<title>Kuwentista</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF6EC; --surface:#FFFFFF; --surface2:#FBEADF;
  --ink:#2B2440; --ink-soft:#6A6083;
  --accent:#D6467E; --accent-ink:#FFFFFF;
  --gold:#F2A83C; --navy:#2C4A6E;
  --good:#2F9C5D; --bad:#D8433A;
  --border:#F0DCC7;
  --shadow: 0 8px 24px rgba(214,70,126,0.14);
  --radius:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1D1626; --surface:#2A2036; --surface2:#352840;
    --ink:#F5EEFB; --ink-soft:#C3B6D6;
    --accent:#F073A0; --accent-ink:#1D1626;
    --gold:#F5C168; --navy:#7FA6D6;
    --good:#4FCB84; --bad:#F0766B;
    --border:#443652;
    --shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
}
:root[data-theme="dark"]{
  --bg:#1D1626; --surface:#2A2036; --surface2:#352840;
  --ink:#F5EEFB; --ink-soft:#C3B6D6;
  --accent:#F073A0; --accent-ink:#1D1626;
  --gold:#F5C168; --navy:#7FA6D6;
  --good:#4FCB84; --bad:#F0766B;
  --border:#443652;
  --shadow: 0 8px 24px rgba(0,0,0,0.4);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Poppins',system-ui,sans-serif;
  min-height:100vh;
}
h1,h2,h3,.display{font-family:'Chewy',cursive; font-weight:400; letter-spacing:0.01em;}
.app{max-width:720px; margin:0 auto; padding:20px 16px 60px;}
.hidden{display:none !important;}
button{font-family:inherit; cursor:pointer;}
button:focus-visible, a:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }

/* HOME */
.hero{display:flex; align-items:center; gap:14px; margin:10px 0 20px;}
.hero-book{width:84px; height:84px; flex:none;}
.hero h1{font-size:2.2rem; margin:0; color:var(--accent);}
.hero p{margin:4px 0 0; color:var(--ink-soft); font-size:0.95rem;}
.lesson-grid{display:grid; gap:14px;}
.lesson-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px 18px; display:flex; align-items:center; gap:14px; box-shadow:var(--shadow);
  text-align:left; width:100%;
}
.final-card{
  border:2px solid var(--gold);
  background:linear-gradient(135deg, color-mix(in srgb, var(--gold) 14%, var(--surface)), var(--surface));
}
.final-badge{
  display:inline-block; font-size:0.68rem; font-weight:800; letter-spacing:0.04em;
  color:var(--navy); background:color-mix(in srgb, var(--gold) 35%, var(--surface));
  padding:2px 8px; border-radius:20px; margin-bottom:3px;
}
.lesson-emoji{font-size:2rem; flex:none; width:52px; height:52px; border-radius:14px;
  background:var(--surface2); display:flex; align-items:center; justify-content:center;}
.lesson-info{flex:1; min-width:0;}
.lesson-info h3{margin:0 0 2px; font-size:1.1rem;}
.lesson-info p{margin:0; color:var(--ink-soft); font-size:0.85rem;}
.stars{margin-top:6px; font-size:0.95rem; letter-spacing:2px;}
.star-on{color:var(--gold);}
.star-off{color:var(--border);}
.go-btn{
  flex:none; background:var(--accent); color:var(--accent-ink); border:none; border-radius:12px;
  padding:10px 16px; font-weight:700; font-size:0.85rem;
}

/* FLASHCARDS */
.screen-head{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
.back-btn{background:none; border:none; color:var(--accent); font-weight:700; font-size:0.95rem; padding:6px 4px;}
.screen-head h2{margin:0; font-size:1.35rem; flex:1;}
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  min-height:260px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:32px 24px; box-shadow:var(--shadow); gap:14px;
}
.card-icon{font-size:2.6rem;}
.card-term{font-family:'Chewy',cursive; font-size:1.5rem; color:var(--accent);}
.card-def{font-size:1.02rem; color:var(--ink-soft); line-height:1.5; white-space:pre-line;}
.card-en{font-size:0.92rem; color:var(--ink); line-height:1.45; white-space:pre-line; text-align:left; width:100%;
  background:color-mix(in srgb, var(--navy) 10%, var(--surface)); border-left:4px solid var(--navy); border-radius:10px; padding:10px 14px;}
.en-label{display:block; font-weight:800; font-size:0.75rem; letter-spacing:0.04em; color:var(--navy); margin-bottom:2px;}
.card.tip{border:3px solid var(--gold); background:color-mix(in srgb, var(--gold) 10%, var(--surface));}
.card.tip .card-term{color:var(--ink);}
.card.tip .card-def{color:var(--ink); text-align:left;}
.q-help{background:none; border:1px dashed var(--navy); color:var(--navy); border-radius:10px; padding:6px 12px; font-weight:700; font-size:0.85rem; margin:-8px 0 14px;}
.q-en{font-size:0.92rem; color:var(--ink); background:color-mix(in srgb, var(--navy) 10%, var(--surface)); border-left:4px solid var(--navy); border-radius:10px; padding:8px 12px; margin:-8px 0 14px;}
.fb-en{margin-top:8px; font-size:0.88rem; color:var(--ink-soft);}
.card-nav{display:flex; justify-content:space-between; align-items:center; margin-top:16px; gap:10px;}
.nav-btn{
  background:var(--surface2); color:var(--ink); border:1px solid var(--border); border-radius:12px;
  padding:12px 18px; font-weight:600;
}
.nav-btn:disabled{opacity:0.4; cursor:default;}
.dots{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; max-width:140px;}
.dot{width:8px; height:8px; border-radius:50%; background:var(--border);}
.dot.active{background:var(--accent);}
.primary-btn{
  background:var(--accent); color:var(--accent-ink); border:none; border-radius:14px;
  padding:14px 22px; font-weight:700; font-size:1rem; width:100%; margin-top:18px;
}

/* QUIZ */
.quiz-top{display:flex; align-items:center; gap:14px; margin-bottom:16px;}
.progress-bar{flex:1; height:10px; background:var(--surface2); border-radius:6px; overflow:hidden;}
.progress-fill{height:100%; background:var(--accent); transition:width .3s;}
.quiz-book{width:46px; height:46px; flex:none;}
.q-text{font-size:1.1rem; font-weight:700; margin:6px 0 16px; line-height:1.4;}
.options{display:grid; gap:10px;}
.option{
  background:var(--surface); border:2px solid var(--border); border-radius:14px; padding:14px 16px;
  text-align:left; font-size:1rem; font-weight:600; color:var(--ink);
}
.option.correct{border-color:var(--good); background:color-mix(in srgb, var(--good) 14%, var(--surface));}
.option.incorrect{border-color:var(--bad); background:color-mix(in srgb, var(--bad) 14%, var(--surface));}
.option:disabled{cursor:default;}
.feedback{margin-top:14px; padding:14px 16px; border-radius:14px; font-size:0.95rem; line-height:1.5;}
.feedback.good{background:color-mix(in srgb, var(--good) 16%, var(--surface)); color:var(--ink);}
.feedback.bad{background:color-mix(in srgb, var(--bad) 16%, var(--surface)); color:var(--ink);}
.feedback strong{display:block; margin-bottom:4px; font-family:'Chewy',cursive; font-size:1.05rem;}
.q-sentence{
  background:var(--surface2); border:2px solid var(--border); border-radius:14px; padding:14px 16px;
  font-size:1.2rem; font-weight:700; line-height:1.5; text-align:center; margin:-4px 0 16px; color:var(--ink);
}
.passage{
  background:var(--surface2); border:1px solid var(--border); border-radius:14px; padding:14px 16px;
  font-size:0.95rem; line-height:1.55; margin-bottom:14px; color:var(--ink);
}
.passage strong{font-family:'Chewy',cursive; color:var(--accent); display:block; margin-bottom:4px; font-size:1.05rem;}

/* RESULTS */
.results{text-align:center; padding:20px 10px;}
.results-book{width:180px; height:180px; margin:0 auto 14px;}
.results h2{font-size:1.75rem; color:var(--accent); margin:0 0 4px;}
.score-line{font-size:1.05rem; color:var(--ink-soft); margin-bottom:10px;}
.results-stars{font-size:2rem; letter-spacing:8px; margin-bottom:18px;}
.points-total{display:inline-flex; align-items:center; gap:6px; background:color-mix(in srgb, var(--gold) 30%, var(--surface)); color:var(--ink); font-weight:800; font-size:0.85rem; padding:6px 14px; border-radius:999px; margin-top:8px;}
.points-live{font-size:0.85rem; font-weight:800; color:var(--ink); white-space:nowrap; margin-left:auto;}
.points-live .streak{color:var(--bad); margin-left:4px;}
.points-earned{font-size:1rem; font-weight:800; color:var(--ink); margin-bottom:4px;}
.missed-review{display:none; text-align:left; margin:0 0 18px; padding-top:16px; border-top:1px solid var(--border);}
.missed-review.show{display:block;}
.missed-review h3{font-size:1rem; font-family:'Chewy',cursive; font-weight:400; color:var(--ink); margin:0 0 10px; text-align:center;}
.missed-list{max-height:340px; overflow-y:auto; padding-right:2px;}
.missed-item{background:var(--surface2); border-radius:12px; padding:12px 14px; margin-bottom:10px;}
.missed-item .missed-q{white-space:pre-line; font-weight:700; color:var(--ink); margin:0 0 4px; line-height:1.4; font-size:0.96rem;}
.missed-item .missed-explain{color:var(--ink-soft); margin:0; line-height:1.4; font-size:0.9rem;}
.results-actions{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
.secondary-btn{
  background:var(--surface2); color:var(--ink); border:1px solid var(--border); border-radius:14px;
  padding:12px 20px; font-weight:600;
}

/* book pieces */
.piece{opacity:0; transform:scale(0.6); transform-origin:center; transition:opacity .35s ease, transform .35s ease;}
.piece.on{opacity:1; transform:scale(1);}

/* 3-up lesson map on wide screens, so every lesson shows at once.
   Only the lesson list widens -- flashcards, quiz and results stay narrow. */
@media (min-width:900px){
  .app{max-width:1120px;}
  .app section:not(#screen-home){max-width:720px; margin-left:auto; margin-right:auto;}
  #screen-home > *:not(.lesson-grid){max-width:720px; margin-left:auto; margin-right:auto;}
  #screen-home .lesson-grid{grid-template-columns:repeat(3, minmax(0,1fr)); align-items:stretch;}
  #screen-home .lesson-card{flex-direction:column; align-items:stretch; gap:10px; height:100%;}
  #screen-home .lesson-emoji{align-self:flex-start;}
  #screen-home .lesson-info{flex:1;}
  #screen-home .go-btn{width:100%; text-align:center;}
}
</style>

<div class="app">

  <!-- HOME -->
  <section id="screen-home">
    <div class="hero">
      <svg class="hero-book" viewBox="0 0 200 200" id="hero-book-svg"></svg>
      <div>
        <h1>Kuwentista</h1>
        <p>Mas mahigpit na antas: bagong halimbawa, hindi lang paulit-ulit sa flashcard. Repasuhin, sagutan, at subukan ang Pangwakas na Pagsusulit para maging handa sa tunay na exam!</p>
        <div class="points-total" id="points-total-badge"></div>
      </div>
    </div>
    <div class="lesson-grid" id="lesson-grid"></div>

  <!-- FLASHCARDS -->
  <section id="screen-cards" class="hidden">

      <button class="back-btn" onclick="goHome()">&larr; Balik</button>
      <h2 id="cards-title"></h2>

      <div class="dots" id="card-dots"></div>
      <button class="nav-btn" id="card-next" onclick="cardStep(1)">Susunod &rarr;</button>
    </div>
    <button class="primary-btn" onclick="startQuiz()">Simulan ang Pagsusulit!</button>
  </section>

  <!-- QUIZ -->
  <section id="screen-quiz" class="hidden">
    <div class="screen-head">
      <button class="back-btn" onclick="goHome()">&larr; Balik</button>
      <h2 id="quiz-title"></h2>
      <div class="points-live" id="points-live"></div>
    </div>
    <div class="quiz-top">
      <div class="progress-bar"><div class="progress-fill" id="quiz-progress"></div></div>
      <svg class="quiz-book" viewBox="0 0 200 200" id="quiz-book-svg"></svg>
    </div>

    <div class="q-en hidden" id="q-en"></div>
    <div class="q-sentence hidden" id="q-sentence"></div>
    <div class="options" id="q-options"></div>
    <div id="q-feedback"></div>
    <button class="primary-btn hidden" id="q-next-btn" onclick="nextQuestion()">Susunod &rarr;</button>
  </section>

  <!-- RESULTS -->
  <section id="screen-results" class="hidden">
    <div class="results">
      <svg class="results-book" viewBox="0 0 200 200" id="results-book-svg"></svg>
      <h2 id="results-heading"></h2>
      <div class="score-line" id="results-score"></div>
      <div class="points-earned" id="points-earned"></div>
      <div class="results-stars" id="results-stars"></div>
      <div class="missed-review" id="missed-review"></div>
      <div class="results-actions">
        <button class="primary-btn" style="width:auto" onclick="retryLesson()">Ulitin</button>
        <button class="secondary-btn" onclick="goHome()">Balik sa Aralin</button>
      </div>
    </div>
  </section>

</div>

      {icon:'🅰️', term:'Patinig', def:'LIMA (5) lang ang patinig:\nA, E, I, O, U', en:'Patinig = vowels. There are only 5: A, E, I, O, U.'},

      {icon:'✨', term:'Ñ at NG', def:'Kasama ang Ñ at NG sa 28 na titik.\nPa-Ingles ang bigkas ng mga titik, MALIBAN sa Ñ.\nAng Ñ ay pa-Espanyol ang bigkas.', en:'Ñ and NG are letters too.\nWe say the letters the English way, EXCEPT Ñ. We say Ñ the Spanish way.'},
      {icon:'📜', term:'Ang 8 Dagdag na Letra', def:'C, F, J, Ñ, Q, V, X, Z\nWala sila sa dating Abakada. Dagdag sila mula sa Ingles at Espanyol.', en:'The 8 added letters: C, F, J, Ñ, Q, V, X, Z. They were not in the old Abakada.'},
      {icon:'🔡', term:'Malaki at Maliit na Titik', def:'A = malaking titik\na = maliit na titik\nDapat alam mong isulat at basahin ang dalawa.', en:'Malaking titik = uppercase (A).\nMaliit na titik = lowercase (a).'},
      {icon:'🔑', tip:true, term:'Paano Sagutin?', def:'Patinig ba? Tingnan kung A, E, I, O, o U.\nKung hindi — KATINIG iyan!\n\nPara magbilang sa isang salita, ituro isa-isa ang bawat titik.\nHal: g-U-r-O → 2 patinig', en:'Is it A, E, I, O, U? Then it is a vowel (patinig). If not, it is a consonant (katinig).\nTo count, point at each letter one by one.'},

    quiz:[
      {q:'Ilang titik mayroon ang Alpabetong Filipino?', qen:'How many letters are in the Filipino alphabet?', options:['26','28','20','30'], correct:1, explain:'28 ang titik: 20 mula sa Abakada + 8 na dagdag.', en:'28 letters (20 + 8).'},
      {q:'Ilan ang patinig sa Filipino?', qen:'How many vowels are there in Filipino?', options:['5','6','4','7'], correct:0, explain:'Lima (5) ang patinig: A, E, I, O, U.', en:'5 vowels: A, E, I, O, U.'},

      {q:'Ano ang kasunod na titik pagkatapos ng "F"?', qen:'Which letter comes right after F?', options:['E','G','H','D'], correct:1, explain:'...E, F, G, H... — ang G ang kasunod ng F.', en:'After F comes G.'},

      {q:'Ilang letra ang idinagdag mula sa Ingles at Espanyol?', qen:'How many letters were added from English and Spanish?', options:['8','10','5','20'], correct:0, explain:'8 ang dagdag: C, F, J, Ñ, Q, V, X, Z.', en:'8 added letters.'},

      {q:'Anong bigkas ang may impit sa huling pantig at tuldik na pakupya ( ˆ )?', qen:'Which kind has a glottal stop on the last syllable and the ˆ mark (pakupya)?', options:['Malumay','Mabilis','Maragsa','Ekspresyon'], correct:2, explain:'MARAGSA — may impit sa huling pantig at tuldik na pakupya ( ˆ ).', en:'Maragsa has the ˆ mark.'},
      {q:'Anong boses ang karaniwang ginagamit dito?\n"Tumigil ka!"', qen:'What kind of voice is usually used here?', options:['Pataas dahil sa galit','Pababa at mahina','Walang tunog','Laging malumanay at pabulong'], correct:0, explain:'Galit ang "Tumigil ka!" kaya PATAAS ang boses.', en:'Angry = the voice goes up.'},
      {q:'Aling salita ang binibigkas nang MABILIS (may ´)?', qen:'Which word is said the MABILIS way (has ´)?', options:['bahay','takbó','guro','aso'], correct:1, explain:'"takbó" — may ´, kaya Mabilis. Ang bahay, guro, at aso ay walang tuldik (Malumay).', en:'takbó has the ´ mark.'},

      {q:'Anong ekspresyon ang bagay?\n"Wala na ang aking alagang aso."', qen:'Which feeling fits?', options:['Tuwa','Lungkot','Galit','Takot'], correct:1, explain:'Nawala ang alagang aso — LUNGKOT.', en:'Losing a pet dog = sad.'},
      {q:'Anong ekspresyon ang bagay?\n"Binilhan ako ni ate ng bagong laruan."', qen:'Which feeling fits?', options:['Tuwa','Lungkot','Galit','Takot'], correct:0, explain:'May bagong laruan — TUWA.', en:'Getting a new toy = happy.'},
      {q:'Tama o Mali: Ang ekspresyon ay ang pagbibigay-lakas sa isang pantig ng salita.', qen:'True or False: "Ekspresyon" means saying one part of a word stronger.', options:['Tama','Mali'], correct:1, explain:'Mali — iyan ang DIIN. Ang ekspresyon ay pagpapakita ng damdamin.', en:'False. That is diin (stress). Ekspresyon = showing feelings.'},
      {q:'Ano ang kahulugan ng "intonasyon"?', qen:'What does "intonasyon" mean?', options:['Pagtaas at pagbaba ng boses','Bilang ng mga pantig sa isang salita','Uri ng pangngalan','Kahulugan ng salita'], correct:0, explain:'Ang intonasyon ay ang pagtaas at pagbaba ng boses kapag nagsasalita.', en:'Your voice going up and down.'},
      {q:'Anong ekspresyon ang bagay?\n"Ay! May daga sa ilalim ng mesa!"', qen:'Which feeling fits?', options:['Tuwa','Lungkot','Galit','Takot'], correct:3, explain:'Biglang may daga — TAKOT.', en:'A sudden mouse = scared.'},
      {q:'Tama o Mali: Malumay ang salitang binibigkas nang dahan-dahan at walang tuldik.', qen:'True or False: Malumay is said slowly and has no accent mark.', options:['Tama','Mali'], correct:0, explain:'Tama — iyan ang Malumay. Hal: bahay, aso, guro.', en:'True.'},

  {
    id:'kwento', emoji:'📖', title:'Maikling Kwento at Tampok na Akda', subtitle:'Tauhan, Tagpuan, Pangyayari',
    flashcards:[
      {icon:'📖', term:'Maikling Kwento', def:'• Maikli at mabilis basahin\n• May SIMULA, GITNA, at WAKAS\n• May isang SULIRANIN (problema)\n• May mga TAUHAN', en:'A short story: it is short, has a beginning, middle, and end, one problem, and characters.'},
      {icon:'🧑', term:'Tauhan', def:'Ang mga GUMAGANAP sa kuwento. Sagot sa "SINO?"\n"Si Ana ay isang masipag at mabait na mag-aaral."\nTauhan: Si Ana', en:'Tauhan = characters. The people or animals in the story. Answers "Who?"'},
      {icon:'🗺️', term:'Tagpuan', def:'Kung SAAN at KAILAN nangyari ang kuwento.\n"Tuwing umaga, pumapasok si Ben sa paaralan."\nSaan? Sa paaralan. Kailan? Tuwing umaga.', en:'Tagpuan = setting. WHERE and WHEN the story happened.'},
      {icon:'🔁', term:'Simula, Gitna, Wakas', def:'SIMULA — makikilala ang tauhan at tagpuan.\n"Pumasok si Lito sa paaralan kasama ang ina."\nGITNA — ang suliranin.\n"Naiwan ni Lito ang baunan sa bahay."\nWAKAS — nalulutas ang suliranin.\n"Dinala ng ina ang baunan sa paaralan."', en:'Beginning = meet the characters and place.\nMiddle = the problem.\nEnd = the problem is solved.'},
      {icon:'🦁', term:'Ang Leon at ang Daga', def:'Tauhan: ang leon at ang daga.\nKinagat ng daga ang lubid para mapalaya ang leon.\nAral: Huwag maliitin ang iba — kahit maliit ay makatutulong.', en:'The mouse bit the rope to free the lion.\nLesson: do not look down on others. Even small ones can help.'},
      {icon:'📜', term:'Akda', def:'Isinulat o inisip ng isang tao. May kaisipan, pangyayari, o aral.\nMaaaring: ALAMAT, KUWENTO, o TULA.', en:'Akda = a written work. It can be a legend (alamat), a story (kuwento), or a poem (tula).'},
      {icon:'🌱', term:'Alamat', def:'Nagsasabi kung PAANO NAGSIMULA ang isang bagay, halaman, hayop, lugar, o pangalan.\nHal: Ang Alamat ng Pinya', en:'Alamat = legend. It tells HOW something began.'},
      {icon:'🍍', term:'Ang Alamat ng Pinya', def:'Laging nagpapahanap si Pina sa kaniyang ina. Nainis ang ina at nasabing sana magkaroon si Pina ng maraming mata. Nawala si Pina, at may lumitaw na halamang maraming "mata" — ang pinya.\nAral: Maging masipag at huwag agad umasa sa iba.', en:'Pina always asked her mother to find things. Her mother wished Pina had many eyes. The pineapple has many "eyes."\nLesson: work hard and do not depend on others right away.'},
      {icon:'🔑', tip:true, term:'Paano Sagutin?', def:'Sa bawat kuwento, hanapin:\nSINO? → tauhan\nSAAN / KAILAN? → tagpuan\nANO ang problema? → gitna\nPAANO nalutas? → wakas\nANO ang natutunan? → aral', en:'For any story, ask: Who? Where and when? What is the problem? How was it solved? What is the lesson?'},

      {q:'Saan nangyari ang kuwento?', qen:'Where did the story happen?', options:['Sa ilalim ng punong-kahoy','Sa ilog','Sa loob ng isang malaking paaralan','Sa bahay'], correct:0, explain:'Nangyari ang kuwento sa ilalim ng punong-kahoy.', en:'Under a tree.', passage:true},
      {q:'Ano ang suliranin ng tipaklong nang dumating ang tag-ulan?', qen:'What problem did the grasshopper have when the rainy season came?', options:['Wala itong pagkain','Nawalan ito ng bahay','Nasaktan ito','Naligaw ito'], correct:0, explain:'Nang dumating ang tag-ulan, wala nang pagkain ang tipaklong.', en:'It had no food.', passage:true},
      {q:'Paano nalutas ang suliranin sa wakas?', qen:'How was the problem solved at the end?', options:['Ibinahagi ng langgam ang pagkain sa tipaklong','Umalis ang tipaklong at naghanap ng ibang punong-kahoy','Umiyak ang langgam','Walang nangyari'], correct:0, explain:'Ibinahagi ng langgam ang kaniyang pagkain sa tipaklong.', en:'The ant shared its food.', passage:true},
      {q:'Ano ang aral ng kuwento?', qen:'What is the lesson of the story?', options:['Mahalaga ang paghahanda at pagiging masipag','Huwag kumain nang marami','Laging matulog sa umaga','Huwag magtiwala sa sinumang kaibigan o kapitbahay'], correct:0, explain:'Natuto ang tipaklong na maging masipag. Mahalaga ang paghahanda at pagiging masipag.', en:'Be ready and work hard.', passage:true},
      {q:'Anong bahagi ng kuwento ito?\n"Napansin ni Lito na naiwan niya ang kaniyang baunan sa bahay."', qen:'Which part of the story is this?', options:['Simula','Gitna','Wakas'], correct:1, explain:'Ito ang suliranin (problema), kaya GITNA.', en:'This is the problem, so it is the Middle.'},
      {q:'Anong bahagi ng kuwento ito?\n"Dinala ng kaniyang ina ang baunan niya sa paaralan."', qen:'Which part of the story is this?', options:['Simula','Gitna','Wakas'], correct:2, explain:'Nalutas na ang problema, kaya WAKAS.', en:'The problem is solved, so it is the End.'},

      {q:'Ano ang aral ng "Ang Leon at ang Daga"?', qen:'What is the lesson of "The Lion and the Mouse"?', options:['Huwag maliitin ang iba — kahit maliit ay makatutulong','Laging matulog nang maaga','Huwag tumulong sa iba','Ang malalaki at malalakas lang ang may kakayahang tumulong'], correct:0, explain:'Huwag maliitin ang iba, dahil kahit maliit ay maaaring makatulong.', en:'Do not look down on others. Even small ones can help.'},
      {q:'Sa "Alamat ng Pinya," bakit marami raw "mata" ang pinya?', qen:'In "The Legend of the Pineapple," why does the pineapple have many "eyes"?', options:['Dahil ito ang naging bunga ng sinabi ng ina ni Pina','Dahil mahilig itong tumingin sa lahat ng dumaraan sa hardin','Dahil ito ay puno','Dahil kulay dilaw ito'], correct:0, explain:'Nasabi ng ina na sana magkaroon si Pina ng maraming mata — at ito ang naging pinya.', en:'Her mother wished Pina had many eyes.'},
      {q:'Ano ang aral ng "Alamat ng Pinya"?', qen:'What is the lesson of "The Legend of the Pineapple"?', options:['Maging masipag at huwag agad umasa sa iba','Laging magpahanap ng mga nawawalang gamit sa nanay','Huwag kumain ng prutas','Matulog nang maaga'], correct:0, explain:'Maging masipag at huwag agad umasa sa iba.', en:'Work hard and do not depend on others right away.'},
      {q:'Ano ang katangian ng maikling kwento?', qen:'What is a feature of a short story?', options:['Napakahaba','May simula, gitna, at wakas','Walang tauhan','Walang suliranin at walang nangyayari sa kuwento'], correct:1, explain:'Ang maikling kwento ay may simula, gitna, at wakas, may suliranin, at may tauhan.', en:'It has a beginning, middle, and end.'},

    ]

      {icon:'🌸', term:'Iba pang Maylapi', def:'madami, marunong, mabango, magaling, maasim, malinis, malamig, makakalikasan (maka + kalikasan)', en:'All of these have an added part (ma- or maka-).'},
      {icon:'📘', term:'Pagsasanay sa Aklat (p. 99)', def:'"Bumili siya ng hinog na mangga." (hinog — payak)\n"Libre ang matrikula sa kanilang paaralan." (libre — payak)\n"Pinaghanda niya ng malamig na inumin ang panauhin." (malamig — maylapi)\n"Maulap ang kalangitan." (maulap — maylapi)', en:'Practice from your book, page 99.'},
      {icon:'🔑', tip:true, term:'Paano Sagutin?', def:'Tingnan ang SIMULA ng salita.\nMay "ma-" o "maka-" na ikinabit? → MAYLAPI\nSalitang-ugat lang? → PAYAK\n\nSubukang tanggalin ang "ma-":\nmaganda → ganda ✔ kaya MAYLAPI', en:'Look at the start of the word. Is ma- or maka- added? Maylapi. Only the root word? Payak.\nTry taking off ma-: maganda becomes ganda.'},

      {q:'Alin ang pang-uri?\n"Itim ang kulay ng kaniyang buhok."', qen:'Which word is the describing word?', options:['kulay','Itim','buhok'], correct:1, explain:'"Itim" ang naglalarawan sa kulay ng buhok.', en:'Itim (black) describes the hair.'},

      {q:'Alin ang PAYAK na pang-uri?', qen:'Which describing word is PAYAK (root word only)?', options:['marunong','hinog','maasim','magaling'], correct:1, explain:'"hinog" ay salitang-ugat lang, kaya payak. Ang iba ay may "ma-."', en:'hinog has nothing added. The others start with ma-.'},

      {q:'Ano ang pang-uri at ang kayarian nito?\n"Bumili siya ng hinog na mangga."', qen:'What is the describing word, and is it payak or maylapi?', options:['hinog — payak','hinog — maylapi','mangga — payak','Bumili — maylapi'], correct:0, explain:'"hinog" ang naglalarawan sa mangga. Salitang-ugat lang, kaya payak.', en:'hinog (ripe) describes the mango. Nothing added, so payak.'},

      {q:'Ano ang pang-uri at ang kayarian nito?\n"Maulap ang kalangitan."', qen:'What is the describing word, and is it payak or maylapi?', options:['Maulap — maylapi','Maulap — payak','kalangitan — payak','kalangitan — maylapi'], correct:0, explain:'"Maulap" ang naglalarawan sa kalangitan. ma + ulap, kaya maylapi.', en:'Maulap (cloudy) describes the sky. ma + ulap, so maylapi.'},

      {q:'Alin ang HINDI panimulang salita ng reaksiyon?', qen:'Which one is NOT a feeling word for a reaction?', options:['natutuwa','naaawa','naglalaro','humahanga'], correct:2, explain:'"naglalaro" ay kilos, hindi damdamin.', en:'naglalaro (playing) is an action, not a feeling.'},

  {

      {q:'Alin ang angkop na salita?\n"______ bait ng batang tumutulong sa kaniyang kapuwa."', qen:'Which word fits in the blank?', options:['Mas','Magsing','Pinaka','Napaka'], correct:3, explain:'"Napakabait ng batang tumutulong sa kaniyang kapuwa." — napaka- (pasukdol).', en:'napaka- fits here.'},
      {q:'Sa Pagtataya, anong titik ang isusulat para sa Pahambing-Hindi Magkatulad?', qen:'In the test, which letters do you write for Pahambing-Hindi Magkatulad?', options:['L','PM','PHM','P'], correct:2, explain:'PHM = Pahambing-Hindi Magkatulad.', en:'PHM.'},

      {q:'Punan ang patlang ng wastong sight word.\n"Gusto ko ng ______ laruan."', qen:'Fill in the blank with the correct sight word.', options:['bagong','tayo','ng','ako'], correct:0, explain:'"Gusto ko ng bagong laruan."', en:'I want a new toy.'},
      {q:'Punan ang patlang ng wastong sight word.\n"Pupunta ______ sa paaralan."', qen:'Fill in the blank with the correct sight word.', options:['ng','tayo','bagong','magandang'], correct:1, explain:'"Pupunta tayo sa paaralan."', en:'We will go to school.'},
      {q:'Punan ang patlang ng wastong sight word.\n"Wala ______ tubig sa baso."', qen:'Fill in the blank with the correct sight word.', options:['tayo','ako','ng','bagong'], correct:2, explain:'"Wala ng tubig sa baso." — "ng" ang sagot ayon sa aralin.', en:'There is no more water in the glass.'},
      {q:'Ano ang dapat gawin para mas makilala ang sight words?', qen:'What should you do to know sight words better?', options:['Magbasa araw-araw','Huwag nang magbasa','Magbasa isang beses sa isang taon','Kabisaduhin lang ang mahahabang salita'], correct:0, explain:'Magbasa araw-araw para mas makilala ang mga salitang ito.', en:'Read every day.'},
      {q:'Tama o Mali: Kailangang baybayin nang matagal ang sight words bago ito mabasa.', qen:'True or False: You need to spell out sight words slowly before you can read them.', options:['Tama','Mali'], correct:1, explain:'Mali — nakikita agad at nababasa agad ang sight words.', en:'False. You can read them right away.'},
      {q:'Tama o Mali: Ang pagkatuto ng sight words ay unang hakbang sa pagiging mahusay na mambabasa.', qen:'True or False: Learning sight words is the first step to becoming a good reader.', options:['Tama','Mali'], correct:0, explain:'Tama — iyan ang sabi ng aralin.', en:'True.'},
    ]

const FINAL_EXAM_PER_LESSON = 3;
const STORAGE_KEY = 'kuwentista_progress_v2';
function loadProgress(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }catch(e){ return {}; } }
function saveProgress(p){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }catch(e){} }
let progress = loadProgress();
if (/(^|[?&])reset=1(&|$)/.test(location.search)){
  progress = {};
  saveProgress(progress);
  if (window.history && window.history.replaceState) history.replaceState(null, '', location.pathname + location.hash);
}

const POINTS_KEY = 'kuwentista_points_v1';
function loadTotalPoints(){ try{ return parseInt(localStorage.getItem(POINTS_KEY), 10) || 0; }catch(e){ return 0; } }
function saveTotalPoints(n){ try{ localStorage.setItem(POINTS_KEY, String(n)); }catch(e){} }
let totalPoints = loadTotalPoints();

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function prepareQuestion(q){
  const order = shuffle(q.options.map((_,i)=>i));
  const options = order.map(i=>q.options[i]);
  const correct = order.indexOf(q.correct);
  return { q:q.q, qen:q.qen, options, correct, explain:q.explain, en:q.en, passage:q.passage };
}

  svgEl.querySelectorAll('.piece').forEach(p=>{

/* ---- State ---- */
let currentLessonIdx = 0;
let cardIdx = 0;
let quizIdx = 0;
let quizScore = 0;
let answered = false;
let currentQuizSet = [];
let currentQuizMeta = {id:'', title:''};
let missedQuestions = [];
let sessionPoints = 0, streak = 0, bestStreak = 0;
const POINTS_PER_CORRECT = 10, STREAK_BONUS = 5, STREAK_BONUS_AT = 3;

function updatePointsLive(){
  const el = document.getElementById('points-live');
  if (!el) return;
  el.innerHTML = '⭐ ' + sessionPoints + ' puntos' + (streak >= 2 ? ' <span class="streak">🔥 x' + streak + '</span>' : '');
}

const homeScreen = document.getElementById('screen-home');
const cardsScreen = document.getElementById('screen-cards');
const quizScreen = document.getElementById('screen-quiz');
const resultsScreen = document.getElementById('screen-results');

function showScreen(el){
  [homeScreen, cardsScreen, quizScreen, resultsScreen].forEach(s=>s.classList.add('hidden'));
  el.classList.remove('hidden');
  window.scrollTo(0,0);
}

function starsFor(pct){
  if(pct >= 1) return 3;
  if(pct >= 0.83) return 2;
  if(pct >= 0.58) return 1;
  return 0;
}

function renderHome(){
  document.getElementById('points-total-badge').textContent = '⭐ ' + totalPoints + ' na puntos';
  renderBook(document.getElementById('hero-book-svg'), 8);
  const grid = document.getElementById('lesson-grid');
  grid.innerHTML = '';

  const finalTotal = LESSONS.length * FINAL_EXAM_PER_LESSON;
  const finalBest = progress['final'] || 0;
  const finalStars = starsFor(finalBest / finalTotal);
  const finalCard = document.createElement('button');
  finalCard.className = 'lesson-card final-card';
  finalCard.onclick = startFinalExam;
  finalCard.innerHTML = `
    <div class="lesson-emoji">🏆</div>
    <div class="lesson-info">
      <div class="final-badge">PANGWAKAS NA PAGSUSULIT</div>
      <h3>Buong Pagsusulit</h3>
      <p>Halo-halong tanong mula sa lahat ng aralin — parang tunay na exam!</p>
      <div class="stars">${[1,2,3].map(s=>`<span class="${s<=finalStars?'star-on':'star-off'}">★</span>`).join('')}</div>
    </div>
    <div class="go-btn">${finalBest>0?'Ulitin':'Subukan'}</div>
  `;
  grid.appendChild(finalCard);

  LESSONS.forEach((lesson, i)=>{
    const best = progress[lesson.id] || 0;
    const stars = starsFor(best / lesson.quiz.length);
    const card = document.createElement('button');
    card.className = 'lesson-card';
    card.onclick = ()=>openLesson(i);
    card.innerHTML = `
      <div class="lesson-emoji">${lesson.emoji}</div>
      <div class="lesson-info">
        <h3>${lesson.title}</h3>
        <p>${lesson.subtitle}</p>
        <div class="stars">${[1,2,3].map(s=>`<span class="${s<=stars?'star-on':'star-off'}">★</span>`).join('')}</div>
      </div>
      <div class="go-btn">${best>0?'Balikan':'Simulan'}</div>
    `;
    grid.appendChild(card);
  });
  showScreen(homeScreen);
}

function goHome(){ renderHome(); }

function openLesson(i){
  currentLessonIdx = i;
  cardIdx = 0;
  renderCard();
  showScreen(cardsScreen);
}

function renderCard(){
  const lesson = LESSONS[currentLessonIdx];
  document.getElementById('cards-title').textContent = lesson.title;
  const fc = lesson.flashcards[cardIdx];
  document.getElementById('card-icon').textContent = fc.icon;
  document.getElementById('card-term').textContent = fc.term;
  document.getElementById('card-def').textContent = fc.def;
  const enEl = document.getElementById('card-en');
  enEl.innerHTML = fc.en ? '<span class="en-label">SA ENGLISH</span>' : '';
  enEl.appendChild(document.createTextNode(fc.en || ''));
  enEl.classList.toggle('hidden', !fc.en);
  document.querySelector('#screen-cards .card').classList.toggle('tip', !!fc.tip);
  document.getElementById('card-prev').disabled = cardIdx === 0;
  document.getElementById('card-next').disabled = cardIdx === lesson.flashcards.length - 1;
  const dots = document.getElementById('card-dots');
  dots.innerHTML = '';
  lesson.flashcards.forEach((_, idx)=>{
    const d = document.createElement('div');
    d.className = 'dot' + (idx === cardIdx ? ' active' : '');
    dots.appendChild(d);
  });
}

function cardStep(dir){
  const lesson = LESSONS[currentLessonIdx];
  cardIdx = Math.max(0, Math.min(lesson.flashcards.length - 1, cardIdx + dir));
  renderCard();
}

function startQuiz(){
  const lesson = LESSONS[currentLessonIdx];
  currentQuizSet = shuffle(lesson.quiz).map(prepareQuestion);
  currentQuizMeta = {id:lesson.id, title:lesson.title};
  quizIdx = 0;
  quizScore = 0;
  missedQuestions = [];
  sessionPoints = 0; streak = 0; bestStreak = 0;
  renderQuestion();
  showScreen(quizScreen);
}

function startFinalExam(){
  let qs = [];
  LESSONS.forEach(l=>{
    qs = qs.concat(shuffle(l.quiz).slice(0, FINAL_EXAM_PER_LESSON));
  });
  currentQuizSet = shuffle(qs).map(prepareQuestion);
  currentQuizMeta = {id:'final', title:'Pangwakas na Pagsusulit'};
  quizIdx = 0;
  quizScore = 0;
  missedQuestions = [];
  sessionPoints = 0; streak = 0; bestStreak = 0;
  renderQuestion();
  showScreen(quizScreen);
}

function renderQuestion(){
  answered = false;
  document.getElementById('quiz-title').textContent = currentQuizMeta.title;
  updatePointsLive();
  const total = currentQuizSet.length;
  document.getElementById('quiz-progress').style.width = `${(quizIdx/total)*100}%`;
  renderBook(document.getElementById('quiz-book-svg'), Math.round((quizScore/total)*8));
  const q = currentQuizSet[quizIdx];
  const passageEl = document.getElementById('q-passage');
  passageEl.innerHTML = q.passage ? `<div class="passage"><strong>Basahin ang Kuwento:</strong>${STORY_PASSAGE}</div>` : '';
  const [prompt, sentence] = q.q.split('\n');
  document.getElementById('q-text').textContent = `Tanong ${quizIdx+1} sa ${total}: ${prompt}`;
  const sentenceEl = document.getElementById('q-sentence');
  sentenceEl.textContent = sentence || '';
  sentenceEl.classList.toggle('hidden', !sentence);
  const qEnEl = document.getElementById('q-en');
  qEnEl.textContent = q.qen || '';
  qEnEl.classList.add('hidden');
  document.getElementById('q-help').classList.toggle('hidden', !q.qen);
  const opts = document.getElementById('q-options');
  opts.innerHTML = '';
  q.options.forEach((opt, idx)=>{
    const b = document.createElement('button');
    b.className = 'option';
    b.textContent = opt;
    b.onclick = ()=>selectOption(idx);
    opts.appendChild(b);
  });
  document.getElementById('q-feedback').innerHTML = '';
  document.getElementById('q-next-btn').classList.add('hidden');
}

function showQuestionEnglish(){
  document.getElementById('q-help').classList.add('hidden');
  document.getElementById('q-en').classList.remove('hidden');
}

function selectOption(idx){
  if(answered) return;
  answered = true;
  const q = currentQuizSet[quizIdx];
  const buttons = document.querySelectorAll('#q-options .option');
  buttons.forEach((b, i)=>{
    b.disabled = true;
    if(i === q.correct) b.classList.add('correct');
    else if(i === idx) b.classList.add('incorrect');
  });
  const correct = idx === q.correct;
  if(correct){
    quizScore++;
    streak++;
    if(streak > bestStreak) bestStreak = streak;
    const pts = POINTS_PER_CORRECT + (streak >= STREAK_BONUS_AT ? STREAK_BONUS : 0);
    sessionPoints += pts;
    totalPoints += pts;
    saveTotalPoints(totalPoints);
  } else {
    streak = 0;
    missedQuestions.push({ q: q.q, explain: q.explain, en: q.en });
  }
  updatePointsLive();
  renderBook(document.getElementById('quiz-book-svg'), Math.round((quizScore/currentQuizSet.length)*8));
  const fb = document.getElementById('q-feedback');
  fb.innerHTML = `<div class="feedback ${correct?'good':'bad'}"><strong>${correct?'Tama! 🎉':'Hindi tama.'}</strong>${q.explain}${q.en ? `<div class="fb-en"><b>Sa English:</b> ${q.en}</div>` : ''}</div>`;
  document.getElementById('q-next-btn').classList.remove('hidden');
}

function nextQuestion(){
  quizIdx++;
  if(quizIdx >= currentQuizSet.length){
    finishQuiz();
  } else {
    renderQuestion();
  }
}

function finishQuiz(){
  const best = Math.max(progress[currentQuizMeta.id] || 0, quizScore);
  progress[currentQuizMeta.id] = best;
  saveProgress(progress);
  renderResults();
  showScreen(resultsScreen);
}

function renderResults(){
  const total = currentQuizSet.length;
  renderBook(document.getElementById('results-book-svg'), Math.round((quizScore/total)*8));
  const stars = starsFor(quizScore/total);
  document.getElementById('results-heading').textContent =
    stars === 3 ? 'Handa ka na sa Pagsusulit!' : stars > 0 ? 'Malapit ka na!' : 'Balikan Natin!';
  document.getElementById('results-score').textContent = `Nakakuha ka ng ${quizScore} sa ${total} sa ${currentQuizMeta.title}`;
  let ptsLine = `⭐ +${sessionPoints} puntos sa pagsubok na ito`;
  if(bestStreak >= STREAK_BONUS_AT) ptsLine += ` · 🔥 pinakamahabang sunod-sunod: ${bestStreak}!`;
  document.getElementById('points-earned').textContent = ptsLine;
  document.getElementById('results-stars').innerHTML = [1,2,3].map(s=>`<span class="${s<=stars?'star-on':'star-off'}">★</span>`).join('');
  const reviewEl = document.getElementById('missed-review');
  if(missedQuestions.length){
    reviewEl.innerHTML = '<h3>Mga Tanong na Dapat Balikan</h3><div class="missed-list">' +
      missedQuestions.map(m => `<div class="missed-item"><p class="missed-q">${m.q}</p><p class="missed-explain">${m.explain}</p>${m.en ? `<p class="missed-explain fb-en"><b>Sa English:</b> ${m.en}</p>` : ''}</div>`).join('') +
      '</div>';
  } else {
    reviewEl.innerHTML = '';
  }
  reviewEl.classList.toggle('show', missedQuestions.length > 0);
}

function retryLesson(){
  if(currentQuizMeta.id === 'final'){
    startFinalExam();
  } else {
    startQuiz();
  }
}

renderHome();
</script>
